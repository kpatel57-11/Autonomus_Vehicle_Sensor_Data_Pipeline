apiVersion: apps/v1
kind: Deployment
metadata:
  name: av-pipeline-backend
  namespace: av-pipeline
  labels:
    app: av-backend
    version: "2.0"
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: av-backend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: av-backend
        version: "2.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/api/metrics/prometheus"
    spec:
      serviceAccountName: av-pipeline-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: backend
          image: av-pipeline-backend:2.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: av-pipeline-config
                  key: kafka_bootstrap_servers
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: av-pipeline-secrets
                  key: mongo_uri
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: av-pipeline-config
                  key: postgres_host
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: av-pipeline-secrets
                  key: postgres_password
            - name: SPARK_MASTER
              value: "k8s://https://kubernetes.default.svc"
            - name: PIPELINE_MODE
              value: "batch"
            - name: LOG_LEVEL
              value: "INFO"
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          volumeMounts:
            - name: checkpoints
              mountPath: /tmp/av/checkpoints
            - name: data-lake
              mountPath: /tmp/av/delta
      volumes:
        - name: checkpoints
          persistentVolumeClaim:
            claimName: av-checkpoints-pvc
        - name: data-lake
          persistentVolumeClaim:
            claimName: av-data-lake-pvc
      terminationGracePeriodSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: av-backend-svc
  namespace: av-pipeline
  labels:
    app: av-backend
spec:
  selector:
    app: av-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: av-backend-hpa
  namespace: av-pipeline
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: av-pipeline-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
