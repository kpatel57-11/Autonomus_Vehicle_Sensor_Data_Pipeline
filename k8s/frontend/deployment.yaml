apiVersion: apps/v1
kind: Deployment
metadata:
  name: av-pipeline-frontend
  namespace: av-pipeline
  labels:
    app: av-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: av-frontend
  template:
    metadata:
      labels:
        app: av-frontend
    spec:
      containers:
        - name: frontend
          image: av-pipeline-frontend:2.0
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: av-frontend-svc
  namespace: av-pipeline
spec:
  selector:
    app: av-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: av-pipeline-ingress
  namespace: av-pipeline
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
spec:
  ingressClassName: nginx
  rules:
    - host: av-pipeline.company.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: av-frontend-svc
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: av-backend-svc
                port:
                  number: 8000
