global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'av-pipeline-backend'
    static_configs:
      - targets: ['backend:8000']
    metrics_path: '/api/metrics/prometheus'
    scrape_interval: 30s

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka:9092']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
